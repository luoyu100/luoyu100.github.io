<script>
    document.addEventListener('DOMContentLoaded', function () {
        var totalCitation = document.getElementById('total_cit')
        var citationEles = document.getElementsByClassName('show_paper_citations')
        if (!totalCitation && citationEles.length === 0) {
            return
        }

        {% if site.google_scholar_stats_use_cdn %}
        var gsDataBaseUrl = 'https://cdn.jsdelivr.net/gh/{{ site.repository }}@'
        {% else %}
        var gsDataBaseUrl = 'https://raw.githubusercontent.com/{{ site.repository }}/'
        {% endif %}

        fetch(gsDataBaseUrl + 'google-scholar-stats/gs_data.json')
          .then(function (response) {
            if (!response.ok) {
                throw new Error('Citation data unavailable')
            }
            return response.json()
          })
          .then(function (data) {
            if (totalCitation) {
                totalCitation.textContent = data['citedby']
            }
            Array.prototype.forEach.call(citationEles, element => {
                var paperId = element.getAttribute('data')
                var numCitations = data['publications'][paperId]['num_citations']
                element.textContent = '| Citations: ' + numCitations
            })
          })
          .catch(function () {})
    })
</script>
