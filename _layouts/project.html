---
layout: compress
---

<!doctype html>
<html lang="en" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body class="project-page-body">
    {% include browser-upgrade.html %}

    <main class="project-main" role="main">
      {{ content }}
    </main>

    {% include scripts.html %}
    <script>
      (function () {
        function copyText(text, button) {
          function markCopied() {
            var label = button.querySelector("span");
            if (!label) {
              return;
            }
            var original = label.textContent;
            button.classList.add("copied");
            label.textContent = "Cop";
            window.setTimeout(function () {
              button.classList.remove("copied");
              label.textContent = original;
            }, 2000);
          }

          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(markCopied).catch(function () {
              fallbackCopy(text, markCopied);
            });
            return;
          }

          fallbackCopy(text, markCopied);
        }

        function fallbackCopy(text, callback) {
          var textarea = document.createElement("textarea");
          textarea.value = text;
          textarea.setAttribute("readonly", "");
          textarea.style.position = "fixed";
          textarea.style.top = "-1000px";
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand("copy");
          document.body.removeChild(textarea);
          callback();
        }

        document.querySelectorAll(".copy-bibtex-btn").forEach(function (button) {
          button.addEventListener("click", function () {
            var section = button.closest(".project-bibtex-section");
            var code = section ? section.querySelector("#bibtex-code code, #bibtex-code") : null;
            if (code) {
              copyText(code.textContent.trim(), button);
            }
          });
        });

        document.querySelectorAll("[data-project-carousel]").forEach(function (carousel) {
          var cards = Array.prototype.slice.call(carousel.querySelectorAll("[data-carousel-item]"));
          var dots = Array.prototype.slice.call(carousel.querySelectorAll("[data-carousel-dot]"));
          var previous = carousel.querySelector("[data-carousel-prev]");
          var next = carousel.querySelector("[data-carousel-next]");
          var activeIndex = 0;

          if (cards.length === 0) {
            return;
          }

          function show(index) {
            activeIndex = (index + cards.length) % cards.length;
            cards.forEach(function (card, index) {
              card.classList.toggle("is-active", index === activeIndex);
            });
            dots.forEach(function (dot, index) {
              dot.classList.toggle("is-active", index === activeIndex);
            });
          }

          function move(delta) {
            show(activeIndex + delta);
          }

          if (previous) {
            previous.addEventListener("click", function () {
              move(-1);
            });
          }

          if (next) {
            next.addEventListener("click", function () {
              move(1);
            });
          }

          dots.forEach(function (dot) {
            dot.addEventListener("click", function () {
              show(Number(dot.getAttribute("data-carousel-dot")) || 0);
            });
          });

          show(0);
        });
      }());
    </script>
  </body>
</html>
