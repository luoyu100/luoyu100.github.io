graph-of-states:
  title: "Graph of States: Solving Abductive Tasks with Large Language Models"
  short_name: "Graph of States"
  abbreviation: "GoS"
  authors:
    - "Yu Luo"
    - "Rongchen Gao"
    - "Lu Teng"
    - "Xidao Wen"
    - "Jiamin Jiang"
    - "Qingliang Zhang"
    - "Yongqian Sun"
    - "Shenglin Zhang"
    - "Jiasong Feng"
    - "Tong Liu"
    - "Wenjie Zhang"
    - "Dan Pei"
  venue: "ICML 2026"
  conference_title: "Forty-third International Conference on Machine Learning"
  year: 2026
  arxiv_id: "2603.21250"
  arxiv_url: "https://arxiv.org/abs/2603.21250"
  openreview_url: "https://openreview.net/forum?id=F6PoIbPAe2"
  code_url: "https://github.com/gaorch85/Graph-of-States"
  code_license: "MIT"
  project_url: "https://luoyu100.github.io/projects/graph-of-states/project/"
  description: "Graph of States (GoS) is a neuro-symbolic framework for abductive reasoning with LLMs, published at ICML 2026. It grounds multi-agent collaboration in structured belief states: a causal graph encodes logical dependencies and a state machine governs valid reasoning transitions, turning unconstrained exploration into a directed search."
  abstract: "Logical reasoning encompasses deduction, induction, and abduction. However, while Large Language Models (LLMs) have effectively mastered the former two, abductive reasoning remains significantly underexplored. Existing frameworks, predominantly designed for static deductive tasks, fail to generalize to abductive reasoning due to unstructured state representation and lack of explicit state control. Consequently, they are inevitably prone to Evidence Fabrication, Context Drift, Failed Backtracking, and Early Stopping. To bridge this gap, we introduce Graph of States (GoS), a general-purpose neuro-symbolic framework tailored for abductive tasks. GoS grounds multi-agent collaboration in structured belief states, utilizing a causal graph to explicitly encode logical dependencies and a state machine to govern valid reasoning transitions. By dynamically aligning the reasoning focus with these symbolic constraints, our approach transforms aimless, unconstrained exploration into a convergent, directed search. Extensive evaluations on two real-world datasets demonstrate that GoS significantly outperforms all baselines, providing a robust solution for complex abductive tasks."
  faq:
    - question: "What is Graph of States (GoS)?"
      answer: "Graph of States is a neuro-symbolic framework that solves abductive tasks with large language models, published at ICML 2026. Instead of an unstructured conversation history, it keeps the reasoning state in a structured belief graph of symptoms, hypotheses, evidence, and causal links, and a state machine governs backtracking, drill-down, and reporting."
    - question: "What problem does it solve, and how?"
      answer: "Abductive tasks — explaining observed symptoms by searching for hidden causes — expose four recurring failures in existing LLM reasoning frameworks: evidence fabrication, context drift, failed backtracking, and early stopping. GoS turns aimless exploration into a directed search: the current belief state selects the next reasoning focus, new evidence updates confidences and links, and explicit state transitions decide whether to refine an explanation or abandon it. Frameworks such as chain-of-thought or tree-of-thought search are designed for static deductive problems and lack this explicit state control."
    - question: "What was evaluated, and what were the results?"
      answer: "GoS was evaluated on two real-world diagnosis datasets: medical diagnosis (Table 1) and distributed-system failure diagnosis (Table 3). It reaches 39.86% Human-judged Match on medical diagnosis versus 26.09% for the best baseline (Multi/FoT), and 70.67% LLM-judged Match on system failure diagnosis versus 34.00% (Multi/CoT). The two tasks use different judges, so the two numbers are not directly comparable."
    - question: "How can I use it, and what are its limitations?"
      answer: "The code and all prompts are open at github.com/gaorch85/Graph-of-States under an MIT license, with a Python 3.12 environment and configuration files for both evaluation domains. GoS targets diagnosis-style abductive reasoning; the medical evaluation is a research benchmark and is not evidence of clinical readiness."

opsagent:
  title: "OpsAgent: An Evolving Multi-agent System for Incident Management in Microservices"
  short_name: "OpsAgent"
  abbreviation: "OpsAgent"
  authors:
    - "Yu Luo"
    - "Jiamin Jiang"
    - "Jingfei Feng"
    - "Lei Tao"
    - "Qingliang Zhang"
    - "Xidao Wen"
    - "Yongqian Sun"
    - "Shenglin Zhang"
    - "Tong Liu"
    - "Wenjie Zhang"
    - "Dan Pei"
  venue: "ASE 2026"
  conference_title: "41st IEEE/ACM International Conference on Automated Software Engineering (ASE 2026), Industry Showcase"
  year: 2026
  arxiv_id: "2510.24145"
  arxiv_url: "https://arxiv.org/abs/2510.24145"
  code_url: "https://github.com/Johnn13/OpsAgent"
  code_license: ""
  project_url: "https://luoyu100.github.io/projects/opsagent/project/"
  description: "OpsAgent is a lightweight, self-evolving multi-agent system for incident management in microservices, published in the ASE 2026 Industry Showcase. A training-free data processor converts heterogeneous observability data into structured descriptions, specialized agents produce auditable diagnoses, and dual self-evolution grows the system over time."
  abstract: "Incident management (IM) is central to the reliability of large-scale microservice systems. Yet manual IM, where on-call engineers examine metrics, logs, and traces, is labor-intensive and error-prone in the face of massive and heterogeneous observability data. Existing automated IM approaches often struggle to generalize across systems, provide limited interpretability, and incur high deployment costs, which hinders adoption in practice. In this paper, we present OpsAgent, a lightweight, self-evolving multi-agent system for IM that employs a training-free data processor to convert heterogeneous observability data into structured textual descriptions, along with a multi-agent collaboration framework that makes diagnostic inference transparent and auditable. To support continual capability growth, OpsAgent also introduces a dual self-evolution mechanism that integrates internal model updates with external experience accumulation, thereby closing the deployment loop. Comprehensive experiments on the OPENRCA benchmark demonstrate state-of-the-art performance and show that OpsAgent is generalizable, interpretable, cost-efficient, and self-evolving, making it a practically deployable and sustainable solution for long-term operation in real-world microservice systems. Notably, its deployment in Lenovo's production environment further validates its effectiveness in real-world industrial settings."
  faq:
    - question: "What is OpsAgent?"
      answer: "OpsAgent is a lightweight, self-evolving multi-agent system for incident management in microservice systems, published in the ASE 2026 Industry Showcase track. It turns heterogeneous observability data into structured textual descriptions through a training-free data processor, and coordinates specialized agents that produce transparent, auditable root-cause reports for on-call engineers."
    - question: "What problem does it solve, and how?"
      answer: "Manual incident management is labor-intensive and error-prone because metrics, logs, and traces are massive and heterogeneous. OpsAgent first prepares evidence with a training-free processor — no system-specific model training — then splits diagnosis among task-specific agents for anomaly detection, failure triage, and root-cause localization, whose answers are cross-reviewed before reporting. Separately from this fixed pipeline, dual self-evolution improves the system over time: internal PPO fine-tuning of the agents and external reflection that accumulates reusable incident knowledge."
    - question: "What was evaluated, and what were the results?"
      answer: "On the OPENRCA benchmark with Qwen2.5-14B-Instruct-1M as the seed model, the full system averages 16.54% Correct and 41.35% Partial diagnoses (Table 1), with 71.18 seconds per incident measured for that configuration. Increasing the share of incidents used for self-evolution training from 0% to 60% raises average Correct from 8.27% to 16.54% (Table 3). Runtime depends on the model and deployment setup and is not a cross-hardware guarantee."
    - question: "How can I use it, and what are its limitations?"
      answer: "The research code is at github.com/Johnn13/OpsAgent; the repository has no license file yet, so check with the maintainers before reuse. This OpsAgent is an academic incident-diagnosis system and is unrelated to Google Cloud's Ops Agent telemetry collector. In the paper's deployment case, OpsAgent produces the diagnosis and engineers decide on and perform the remediation."

trioxpert:
  title: "TrioXpert: An Automated Incident Management Framework for Microservice System"
  short_name: "TrioXpert"
  abbreviation: "TrioXpert"
  authors:
    - "Yongqian Sun"
    - "Yu Luo"
    - "Xidao Wen"
    - "Yuan Yuan"
    - "Xiaohui Nie"
    - "Shenglin Zhang"
    - "Tong Liu"
    - "Xi Luo"
  venue: "ASE 2025"
  conference_title: "2025 40th IEEE/ACM International Conference on Automated Software Engineering (ASE)"
  year: 2025
  date_published: "2025-11-16"
  doi: "10.1109/ASE63991.2025.00267"
  doi_url: "https://doi.org/10.1109/ASE63991.2025.00267"
  firstpage: "3239"
  lastpage: "3250"
  arxiv_id: "2506.10043"
  arxiv_url: "https://arxiv.org/abs/2506.10043"
  code_url: "https://github.com/luoyu100/TrioXpert"
  code_license: ""
  project_url: "https://luoyu100.github.io/projects/trioxpert/project/"
  description: "TrioXpert is an end-to-end incident management framework for microservice systems, published at ASE 2025. It handles anomaly detection, failure triage, and root cause localization over multimodal observability data with collaborative, interpretable LLM reasoning."
  abstract: "Automated incident management plays a pivotal role in large-scale microservice systems. However, many existing methods rely solely on single-modal data (e.g., metrics, logs, and traces) and struggle to simultaneously address multiple downstream tasks, including anomaly detection (AD), failure triage (FT), and root cause localization (RCL). Moreover, the lack of clear reasoning evidence in current techniques often leads to insufficient interpretability. To address these limitations, we propose TrioXpert, an end-to-end incident management framework capable of fully leveraging multimodal data. TrioXpert designs three independent data processing pipelines based on the inherent characteristics of different modalities, comprehensively characterizing the operational status of microservice systems from both numerical and textual dimensions. It employs a collaborative reasoning mechanism using large language models (LLMs) to simultaneously handle multiple tasks while providing clear reasoning evidence to ensure strong interpretability. We conducted extensive evaluations on two microservice system datasets, and the experimental results demonstrate that TrioXpert achieves outstanding performance in AD (improving by 4.7% to 57.7%), FT (improving by 2.1% to 40.6%), and RCL (improving by 1.6% to 163.1%) tasks. TrioXpert has also been deployed in Lenovo's production environment, demonstrating substantial gains in diagnostic efficiency and accuracy."
  faq:
    - question: "What is TrioXpert?"
      answer: "TrioXpert is an end-to-end automated incident management framework for microservice systems, published at ASE 2025 (DOI 10.1109/ASE63991.2025.00267). It combines multimodal data processing with collaborative LLM reasoning to handle three downstream tasks in one system — anomaly detection (AD), failure triage (FT), and root cause localization (RCL) — with interpretable reasoning evidence."
    - question: "What problem does it solve, and how?"
      answer: "Many existing methods rely on single-modal data and handle the three tasks separately, while feeding everything into one monolithic LLM loses diagnostic value. TrioXpert instead matches processing to each modality: metrics and traces are modeled numerically by a feature processor, while logs and traces are also summarized textually. A Numerical Expert and a Textual Expert analyze these complementary views, and an Incident Expert reconciles them under an explicit evidence policy — logs outweigh traces when the two conflict, and the numerical view carries greater weight at final aggregation."
    - question: "What was evaluated, and what were the results?"
      answer: "TrioXpert was evaluated on two microservice-system datasets, D1 (public) and D2 (not released). On Table II it reaches F1 0.924 / 0.909 for AD, F1 0.807 / 0.767 for FT, and Avg@5 0.773 / 0.750 for RCL on D1 / D2 respectively. These are separate task metrics and cannot be merged into a single accuracy figure."
    - question: "How can I use it, and what are its limitations?"
      answer: "The code is open at github.com/luoyu100/TrioXpert with a root-cause localization example for the public D1 dataset (Python 3.10 environment). The repository currently has no license file, so clarify reuse terms before building on it, and D2 is not publicly available."

opsmem:
  title: "OpsMem: Dual-Memory Reasoning with Cross-Memory Resonance for Failure Diagnosis"
  short_name: "OpsMem"
  abbreviation: "OpsMem"
  authors:
    - "Yongqian Sun"
    - "Rongchen Gao"
    - "Yu Luo"
    - "Wenwei Gu"
    - "Shenglin Zhang"
    - "Qingyi Guo"
    - "Qiuai Fu"
    - "Yaoliang Wu"
    - "Dan Pei"
  venue: "ISSRE 2026"
  conference_title: "International Symposium on Software Reliability Engineering (ISSRE 2026)"
  year: 2026
  arxiv_id: "2607.11357"
  arxiv_url: "https://arxiv.org/abs/2607.11357"
  code_url: "https://github.com/gaorch85/OpsMem"
  code_license: "Apache-2.0"
  project_url: "https://luoyu100.github.io/projects/opsmem/project/"
  description: "OpsMem is a dual-memory reasoning framework for failure diagnosis, accepted at ISSRE 2026. It maintains a short-term memory of the evolving diagnostic state and a long-term memory of reusable operational experience, connected through cross-memory resonance."
  abstract: "Failure diagnosis in modern software systems requires iterative evidence acquisition and hypothesis reasoning guided by operational experience. Existing LLM-based methods improve diagnosis through agentic reasoning or knowledge augmentation, but they often lack a mechanism to coordinate the evolving diagnostic state with operational experience during iterative diagnosis. We propose OpsMem, a dual-memory framework that maintains a short-term memory for the current diagnostic state and a long-term memory for reusable operational experience. OpsMem uses cross-memory resonance to activate state-relevant long-term memory, conditions multi-agent diagnosis on the short-term and activated long-term memories, and consolidates reusable experience from solved incidents back into long-term memory. Experiments on a real-world Huawei microservice failure diagnosis dataset show that OpsMem outperforms representative agentic-reasoning and knowledge-augmented baselines, improving Match and Relevant by up to 46.88% and 18.39% over the strongest baseline, respectively."
  faq:
    - question: "What is OpsMem?"
      answer: "OpsMem is a dual-memory reasoning framework for failure diagnosis, accepted at ISSRE 2026. It maintains a short-term memory for the current diagnostic state — observed symptoms, acquired evidence, and candidate hypotheses — and a long-term memory of reusable operational experience, and connects the two through cross-memory resonance."
    - question: "What problem does it solve, and how?"
      answer: "Existing LLM-based diagnosticians either reason without operational experience or retrieve knowledge that ignores where the diagnosis currently stands. OpsMem's cross-memory resonance activates state-relevant long-term memory as the diagnostic state evolves, conditions multi-agent diagnosis on both memories, and consolidates reusable experience from solved incidents back into long-term memory for future incidents."
    - question: "What was evaluated, and what were the results?"
      answer: "OpsMem was evaluated on 120 real-world failure incidents from Huawei production microservice systems, against agentic-reasoning and knowledge-augmented baselines including ReAct, GoS, VectorRAG, GraphRAG, and LinearRAG. It improves Match and Relevant by up to 46.88% and 18.39% over the strongest baseline respectively (Table I). These are relative improvements, not accuracy points."
    - question: "How can I use it, and what are its limitations?"
      answer: "The framework code is open at github.com/gaorch85/OpsMem under Apache-2.0, including one sanitized example case and a small sanitized seed knowledge base. The full dataset and knowledge base cannot be publicly released due to confidentiality and compliance restrictions, so results on the private Huawei data are not reproducible from the public release alone."

