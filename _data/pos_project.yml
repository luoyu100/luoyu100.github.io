paper_title: "Beyond Memory: Harnessing Long-Horizon Agents with Explicit Belief States"
code_url: https://anonymous.4open.science/r/PoS-321C
authors:
  - {name: Yu Luo, affiliation: 1}
  - {name: Jiamin Jiang, affiliation: 1}
  - {name: Yimin Zuo, affiliation: 1}
  - {name: Xidao Wen, affiliation: 2}
  - {name: Rongchen Gao, affiliation: 1}
  - {name: Yongqian Sun, affiliation: 1}
  - {name: Shenglin Zhang, affiliation: 1}
  - {name: Guiyang Liu, affiliation: 2}
  - {name: Cheng Zhang, affiliation: 2}
  - {name: Fang Situ, affiliation: 2}
  - {name: Qi Zhou, affiliation: 2}
  - {name: Dan Pei, affiliation: 3}
abstract: >-
  Large language model (LLM) agents can now undertake increasingly complex tasks, but the way they organize interaction history into memory does not ensure a coherent understanding of the current world. We introduce PoS, an inference-time framework that constructs and continually maintains explicit belief states as the agent's decision context. Each belief combines an estimate of the current world state with unresolved task requirements, making explicit what the agent still needs to learn and accomplish. To keep this belief reliable and actionable, PoS validates its consistency and monitors task progress to detect Belief Trapping, where the agent continues to act without making meaningful progress toward the goal. Recovery is then tailored to both the trapping pattern and the type of unresolved task requirement. Experiments on four benchmarks spanning execution and diagnosis show that PoS achieves the highest overall performance on every benchmark with all three LLM backbones. Ablations demonstrate the importance of consistency validation and recovery, while context-scaling experiments show resilience to context growth. Together, these results support belief construction and continual maintenance as a foundation for long-horizon context management beyond history retention and compression.
cases:
  - id: execution
    label: Execution
    title: "The mug is in the cabinet. The task is not done."
    subtitle: "ALFWorld #0096 · Put a hot mug in the cabinet."
    source: "Figure 1, page 1. A schematic reconstruction of two independent runs, not an environment recording."
    steps:
      - title: "One task. Two requirements."
        run: task
        badge: The task
        stage: task
        scene_note: "Put a HOT mug in the cabinet."
        understanding: "The goal requires both a hot mug and the correct location."
        unresolved: "Make Mug 3 hot, then place the hot mug in Cabinet 1."
        constraint: "None yet. The task has just been introduced."
        observation: "Putting an object in the right place is not enough when the goal also requires a change to its state."
        decision: "Track the mug's temperature as well as its location. These are different requirements."
        evidence: "Figure 1 gives the task as 'Put a hot mug in the cabinet' and identifies the missed heating step in the baseline run."
      - title: "The location is right. The temperature is not."
        run: baseline
        badge: Baseline run
        stage: placed
        scene_note: "In the cabinet. Not heated."
        understanding: "The baseline has placed the mug in the cabinet without heating it."
        unresolved: "The heating requirement is still unmet."
        constraint: "No targeted recovery is shown in this baseline trajectory."
        observation: "The mug reaches the cabinet, but the required heating action has been missed."
        decision: "A plausible-looking final arrangement does not mean that every part of the goal has been achieved."
        evidence: "Figure 1 labels the baseline trajectory 'Heat mug missed' followed by 'Put mug in cabinet'."
      - title: "Another check does not make the mug hot."
        run: baseline
        badge: Baseline run
        stage: repeating
        reveal: true
        scene_note: "36 cabinet checks. No heating."
        understanding: "Cabinet examinations continue, but the relevant world state does not change."
        unresolved: "Make Mug 3 hot. Looking inside the cabinet cannot achieve this."
        constraint: "The missing requirement needs a state-changing action, not another cabinet check."
        observation: "The paper reports 36 cabinet examinations and failure after 50 steps in this baseline run."
        decision: "Separate activity from progress: repeated observations do not satisfy an unresolved achievement requirement."
        evidence: "Figure 1: 'Examine cabinet x36' and 'Failed after 50 steps'. These counts belong to the baseline run only."
      - title: "Now follow the separate PoS run."
        run: pos
        badge: Independent PoS run
        stage: belief
        scene_note: "Active gap: make Mug 3 hot."
        understanding: "PoS represents the mug, microwave, cabinet, and their current states explicitly."
        unresolved: "Make Mug 3 hot; then place the hot mug in Cabinet 1."
        constraint: "Select an action that changes the task-relevant state of the mug."
        observation: "This is PoS's own run on the same task, not a takeover of the baseline after 36 checks."
        decision: "Use the current belief and the active achievement gap to decide what must change next."
        evidence: "The PoS side of Figure 1 exposes 'Active Gap: Make Mug 3 hot' and shows a separate successful trajectory."
      - title: "Do what the unresolved requirement needs."
        run: pos
        badge: Independent PoS run
        stage: heating
        scene_note: "Heat the mug before placing it."
        understanding: "Heating changes the mug's state. The updated belief can now record it as hot."
        unresolved: "Place the hot mug in Cabinet 1."
        constraint: "Once progress is restored, proceed toward the remaining placement requirement."
        observation: "The illustrated PoS sequence puts the mug in the microwave, heats it, and then places it in the cabinet."
        decision: "Update the belief after the observation, so the next action starts from the changed world rather than an outdated description."
        evidence: "Figure 1 lists: 'Put mug in microwave', 'Heat mug', and 'Place hot mug in cabinet'. Figure 2 illustrates the observation that the mug is hot."
      - title: "Both requirements are now satisfied."
        run: pos
        badge: Two independent outcomes
        stage: success
        scene_note: "Hot mug. Correct cabinet."
        understanding: "The mug is hot and is in the target cabinet."
        unresolved: "None for this task."
        constraint: "Release recovery constraints after progress is restored."
        observation: "Baseline: failed after 50 steps. PoS: succeeded in 17 steps in its independent run."
        decision: "The point is not to count more actions, but to maintain what is true now and what still needs to change."
        evidence: "Figure 1 reports the two outcomes separately. This example is not a claim that total inference cost is lower; the paper reports additional belief-maintenance cost."
  - id: diagnosis
    label: Diagnosis
    title: "More investigation. The same unresolved question."
    subtitle: "RCA-100 t024 · Kimi-K3 · Inventory-service diagnosis."
    source: "Appendix F, pages 25-26. One of three recovery episodes in a 28-action run; step indices are zero-based. Evidence is paraphrased from the paper, not fabricated tool output."
    steps:
      - title: "The agent has clues, but not a distinction."
        run: diagnosis
        badge: Before step 22
        stage: investigating
        scene_note: "Database waiting or JVM-side processing?"
        understanding: "Slow inventory requests coincide with elevated garbage-collection activity."
        unresolved: "Are delays caused by database waiting or processing inside the inventory JVM?"
        constraint: "No new recovery constraint at this point."
        observation: "Further log searches continue without distinguishing the two explanations."
        decision: "Keep the diagnostic question explicit. More logs are useful only if they change what the agent can conclude about this gap."
        evidence: "Appendix F: 'Slow inventory requests coincide with elevated garbage-collection (GC) activity.' Further log searches do not distinguish the explanations."
      - title: "Name the stalled progress."
        run: diagnosis
        badge: Step 22
        stage: trapped
        scene_note: "Static stagnation + epistemic gap"
        understanding: "The relevant belief has changed little despite continued investigation."
        unresolved: "Database waiting versus JVM-side processing remains unresolved."
        constraint: "Diagnose both the static pattern and the blocked epistemic gap."
        observation: "At step 22, PoS identifies static stagnation with a persistent epistemic gap."
        decision: "The diagnosis has two parts: how reasoning is stuck, and what knowledge is still missing."
        evidence: "Appendix F records the trapping diagnosis as 'Static Stagnation + Epistemic Gap' at step 22."
      - title: "Constrain the purpose, not the tool call."
        run: diagnosis
        badge: Factorized recovery
        stage: redirecting
        scene_note: "Break repetition. Seek distinguishing evidence."
        understanding: "Neither explanation is yet resolved by the evidence already collected."
        unresolved: "Obtain evidence that separates database waiting from JVM-side processing."
        constraint: "Avoid the ineffective repetition; seek evidence that distinguishes the two explanations."
        observation: "The agent chooses to inspect CPU activity. The recovery module does not provide a diagnosis or prescribe a fixed tool call."
        decision: "Combine a pattern-specific constraint with a gap-specific constraint, while leaving the task agent to select the investigation."
        evidence: "Appendix F: 'The recovery constraints specify what the investigation must resolve, rather than prescribe a tool call or provide the diagnosis.'"
      - title: "Recovery still takes investigation."
        run: diagnosis
        badge: During recovery
        stage: exploring
        scene_note: "Three further low-progress actions."
        understanding: "The competing explanations still need more informative evidence."
        unresolved: "The same diagnostic distinction remains open."
        constraint: "Continue targeting discriminative evidence rather than treating a recovery prompt as a solution."
        observation: "The paper records three additional low-progress actions after recovery begins."
        decision: "A new constraint redirects the search; it does not guarantee that the very next action will resolve the gap."
        evidence: "Appendix F: 'Recovery initially produces three further low-progress actions.' The paper does not provide raw tool logs for these actions."
      - title: "Combine the new evidence with what is already known."
        run: diagnosis
        badge: Step 26
        stage: revised
        scene_note: "CPU activity + earlier GC evidence"
        understanding: "CPU observations and the earlier GC evidence increase support for JVM-side processing and weaken database waiting."
        unresolved: "The targeted epistemic gap is recorded as resolved at step 26."
        constraint: "Use the validated revision to move the diagnosis forward."
        observation: "Subsequent CPU queries show increased activity during the incident."
        decision: "Integrate evidence across steps. CPU evidence contributes to the revision, but does not by itself uniquely determine the failure type."
        evidence: "Appendix F reports increased CPU activity, its combination with earlier GC observations, and gap resolution at step 26."
      - title: "Submit the diagnosis supported by the run."
        run: diagnosis
        badge: Step 27
        stage: resolved
        scene_note: "inventory / memoryPressure"
        understanding: "The final report identifies inventory as the entity and memoryPressure as the failure type."
        unresolved: "The run's reported entity and failure type both match the benchmark label."
        constraint: "Recovery has restored progress toward a final diagnostic report."
        observation: "At step 27, the agent submits inventory / memoryPressure."
        decision: "The case illustrates targeted recovery and evidence integration, not a claim that a single CPU reading proves memory pressure."
        evidence: "Appendix F states that 'inventory / memoryPressure' matches both the entity and failure type in the benchmark label, and explicitly limits what CPU evidence alone establishes."
