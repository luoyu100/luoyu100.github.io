steps:
  - title: "Start with the symptom, not a verdict"
    action: Observe
    focus: alert
    observation: "Checkout starts returning 503s eight minutes after order-service v2.8 is deployed."
    decision: "Record the symptom and time window. A nearby deployment is a lead to investigate, not enough evidence to blame the release."
  - title: "Keep three explanations open"
    action: Hypothesize
    focus: database
    observation: "Checkout depends on order-service, the database, and payment. Each could explain a slow or failed request."
    decision: "Create competing hypotheses in one belief state. Start with database overload, but retain payment and order-service as alternatives."
  - title: "A database wait is only a clue"
    action: Collect evidence
    focus: database
    observation: "An application trace shows a two-second wait to borrow a database connection."
    decision: "Attach this observation to both plausible explanations. It may mean a busy database or a problem with the application's own pool; do not treat it as proof of either."
    updates: {database: {confidence: 0.76}, orders: {confidence: 0.52}}
  - title: "Look beneath database overload"
    action: Drill down
    focus: queries
    observation: "The leading hypothesis is still broad: what would make the database slow?"
    decision: "Refine it into slow SQL and lock contention. Ask for database-side measurements that can distinguish these explanations."
  - title: "Fast SQL weakens the first branch"
    action: Collect evidence
    focus: locks
    observation: "SQL latency is normal: 18 ms at p95. The long application wait happens before a query starts."
    decision: "Connect the measurement to slow SQL with a refuting edge. Keep that branch in the graph and test lock contention next."
    updates: {queries: {confidence: 0.12, status: rejected}, database: {confidence: 0.50}}
  - title: "The second database branch also fails"
    action: Collect evidence
    focus: locks
    observation: "There are no blocked sessions, and database CPU is low throughout the failure window."
    decision: "Lower belief in both lock contention and database overload. Neither refined explanation fits the evidence; continuing here would repeat a dead end."
    updates: {locks: {confidence: 0.08, status: rejected}, database: {confidence: 0.18, status: rejected}}
  - title: "Backtrack to a different explanation"
    action: Backtrack
    focus: orders
    observation: "Both children of database overload have been weakened by direct measurements."
    decision: "Move from depth 2 back to depth 1 and select order-service. Preserve the rejected hypotheses and their evidence so later reasoning does not start the same investigation again."
    updates: {orders: {confidence: 0.62}}
  - title: "Locate the wait inside order-service"
    action: Collect evidence
    focus: orders
    observation: "Payment latency is normal. The trace places the delay inside order-service's connection-acquisition span."
    decision: "Refute payment slowdown and strengthen the order-service branch. The focus now follows measured request timing, not the initial guess."
    updates: {payment: {confidence: 0.12, status: rejected}, orders: {confidence: 0.82}}
  - title: "Separate pool pressure from CPU pressure"
    action: Drill down
    focus: pool
    observation: "The fault is local to order-service, but that still does not explain what is failing."
    decision: "Add pool exhaustion and CPU pressure as depth-2 hypotheses. Request pool counters and runtime measurements rather than choosing a cause by name."
  - title: "Confirm the immediate bottleneck"
    action: Collect evidence
    focus: pool
    observation: "All 80 connections are checked out. New requests queue, although many database sessions are idle."
    decision: "Support pool exhaustion with the observed counters. Distinguish the bottleneck from its cause: a full pool does not yet explain why connections remain borrowed."
    updates: {pool: {confidence: 0.90}, orders: {confidence: 0.90}}
  - title: "Rule out a busy runtime"
    action: Collect evidence
    focus: pool
    observation: "CPU usage is 32% and event-loop lag is 4 ms, both within the healthy range."
    decision: "Mark CPU pressure as unsupported. Keep the pool as the current focus, with the alternative and its refuting evidence still visible."
    updates: {runtime: {confidence: 0.10, status: rejected}}
  - title: "Why is the pool full?"
    action: Drill down
    focus: capacity
    observation: "Pool exhaustion could reflect too little capacity or connections that are never returned."
    decision: "Refine the pool hypothesis into two depth-3 explanations. Test the simpler capacity explanation first, without discarding a possible leak."
  - title: "A workload comparison rejects the easy fix"
    action: Collect evidence
    focus: capacity
    observation: "Traffic and pool size are unchanged. Under the same load, the previous release peaked at 35 of 80 borrowed connections."
    decision: "Lower belief in an undersized pool. Increasing capacity might delay the failure, but the comparison points to changed connection handling instead."
    updates: {capacity: {confidence: 0.14, status: rejected}, leak: {confidence: 0.72}}
  - title: "Backtrack instead of adding capacity"
    action: Backtrack
    focus: pool
    observation: "The capacity branch does not explain why the same workload worked before the release."
    decision: "Return from depth 3 to the depth-2 pool hypothesis. Reconsider its remaining child, using the stored comparison rather than restarting the whole diagnosis."
  - title: "Follow the remaining pool explanation"
    action: Drill down
    focus: leak
    observation: "A connection leak could explain an ever-full pool alongside mostly idle database sessions."
    decision: "Select the existing leak hypothesis. Ask whether each successful borrow has a matching return, especially on failed or canceled requests."
    updates: {leak: {confidence: 0.78}}
  - title: "Connect the leak to canceled requests"
    action: Collect evidence
    focus: leak
    observation: "Only v2.8 shows a growing borrow/return gap after canceled requests. The old release does not under the same test."
    decision: "Attach this evidence to the leak hypothesis. It narrows the search to cancellation handling, but a matching code path and reproduction are still needed."
    updates: {leak: {confidence: 0.90}}
  - title: "Find the missing cleanup path"
    action: Drill down
    focus: cancellation
    observation: "The new cancellation branch can return after borrowing a connection, before connection.release() runs."
    decision: "Create a depth-4 hypothesis: cancellation skips cleanup. Link the code observation to it, then test that path before declaring a root cause."
  - title: "Reproduce the suspected mechanism"
    action: Verify
    focus: cancellation
    observation: "In isolation, 20 requests canceled after acquisition leave exactly 20 connections checked out."
    decision: "The controlled reproduction links this path to retained connections. This is stronger than the earlier correlation between deployment time and failures."
    updates: {cancellation: {confidence: 0.95}}
  - title: "Test a targeted repair"
    action: Verify
    focus: cancellation
    observation: "A finally block guarantees release. The same 20 cancellations now retain zero connections; a matched-load canary recovers."
    decision: "Use the repair as another check of the explanation. The change removes the proposed mechanism and the observed bottleneck without enlarging the pool."
    updates: {cancellation: {confidence: 0.99, status: confirmed}, leak: {confidence: 0.98, status: confirmed}, pool: {confidence: 0.98, status: confirmed}, orders: {confidence: 0.98, status: confirmed}}
  - title: "Report a cause, not just a symptom"
    action: Resolve
    focus: cancellation
    observation: "Canceled requests bypass cleanup in v2.8, leaking connections until the order-service pool is exhausted and checkout returns 503s."
    decision: "Report the evidence-backed path and the verified fix: release the connection in finally. The graph retains the alternatives, two backtracks, and the observations behind the conclusion."
