title: "The database looks guilty. The evidence says otherwise."
intro: "Checkout requests start failing after an order-service release. Follow a diagnosis that tests several explanations, backs out of dead ends, and traces the failure to a missing connection release."
nodes:
  - {id: alert, kind: symptom, label: "Checkout failures", detail: "At 12:08, checkout requests begin returning HTTP 503. Order-service v2.8 was released at 12:00. Timing is a clue, not proof of a cause.", x: 590, y: 60, born: 1}
  - {id: database, kind: hypothesis, label: "Database overload", detail: "The database may be taking too long to serve requests.", depth: 1, x: 210, y: 240, born: 2, confidence: 0.68}
  - {id: payment, kind: hypothesis, label: "Payment slowdown", detail: "A slow payment dependency may be holding up checkout.", depth: 1, x: 590, y: 240, born: 2, confidence: 0.50}
  - {id: orders, kind: hypothesis, label: "Order-service fault", detail: "The delay may originate inside the newly released order service.", depth: 1, x: 970, y: 240, born: 2, confidence: 0.42}
  - {id: wait, kind: evidence, label: "Connection wait: 2 s", detail: "Application traces show roughly two seconds waiting to acquire a database connection. This does not yet distinguish a busy database from a local connection-pool problem.", x: 60, y: 335, born: 3}
  - {id: queries, kind: hypothesis, label: "Slow SQL", detail: "Long-running SQL statements may be keeping connections busy.", depth: 2, x: 110, y: 440, born: 4, confidence: 0.72}
  - {id: locks, kind: hypothesis, label: "Lock contention", detail: "Blocked transactions may be preventing queries from completing.", depth: 2, x: 350, y: 440, born: 4, confidence: 0.55}
  - {id: fast, kind: evidence, label: "SQL p95: 18 ms", detail: "Database-side query latency remains at its healthy baseline, around 18 ms at p95. The slow-SQL explanation does not account for the application wait.", x: -50, y: 555, born: 5}
  - {id: unlocked, kind: evidence, label: "No blocked sessions", detail: "Database inspection finds no blocked sessions and low CPU usage during the incident. There is no supporting evidence for lock contention or database saturation.", x: 350, y: 555, born: 6}
  - {id: trace, kind: evidence, label: "Payment latency normal", detail: "A distributed trace places the delay in order-service's connection acquisition. Payment spans remain at their normal latency; payment is not on the delayed part of the request.", x: 610, y: 335, born: 8}
  - {id: pool, kind: hypothesis, label: "Pool exhaustion", detail: "Order-service may have no free database connections to lend to new requests.", depth: 2, x: 800, y: 440, born: 9, confidence: 0.76}
  - {id: runtime, kind: hypothesis, label: "CPU pressure", detail: "An overloaded application runtime may be delaying requests inside order-service.", depth: 2, x: 1090, y: 440, born: 9, confidence: 0.45}
  - {id: leased, kind: evidence, label: "80 / 80 connections leased", detail: "All 80 pool connections are checked out and new requests queue for a connection. Many associated database sessions are idle: checked out does not mean actively running SQL.", x: 655, y: 550, born: 10}
  - {id: cpu, kind: evidence, label: "CPU 32%; lag 4 ms", detail: "Order-service CPU is 32% and event-loop lag is 4 ms, both within the healthy range. A saturated runtime is not supported by these observations.", x: 1200, y: 555, born: 11}
  - {id: capacity, kind: hypothesis, label: "Pool too small", detail: "Normal traffic demand may exceed the configured pool capacity.", depth: 3, x: 640, y: 650, born: 12, confidence: 0.64}
  - {id: leak, kind: hypothesis, label: "Connection leak", detail: "Some request paths may borrow a connection without returning it.", depth: 3, x: 960, y: 650, born: 12, confidence: 0.50}
  - {id: traffic, kind: evidence, label: "Same load; same pool size", detail: "Traffic and pool size are unchanged. The previous release used at most 35 of 80 connections under the same workload, weakening the pool-capacity explanation.", x: 470, y: 750, born: 13}
  - {id: balance, kind: evidence, label: "Borrow / return gap grows", detail: "In v2.8, successful borrows increasingly outnumber returns after canceled requests. The previous release does not show this pattern under the same test.", x: 1200, y: 750, born: 16}
  - {id: cancellation, kind: hypothesis, label: "Cancel path skips release", detail: "The new cancellation branch exits after acquiring a connection but before returning it to the pool.", depth: 4, x: 960, y: 860, born: 17, confidence: 0.83}
  - {id: code, kind: evidence, label: "Early return before release", detail: "Inspection of the v2.8 change finds a cancellation branch that returns before connection.release(). Cleanup is not guaranteed by a finally block.", x: 660, y: 860, born: 17}
  - {id: reproduce, kind: evidence, label: "20 cancels; 20 retained", detail: "In an isolated reproduction, canceling 20 requests after connection acquisition leaves 20 connections checked out. Other traffic is held constant.", x: 710, y: 990, born: 18}
  - {id: repair, kind: evidence, label: "Fixed: 0 retained", detail: "After moving cleanup into a finally block, the same 20-request cancellation test retains zero connections. A canary under matched load stops exhausting the pool and checkout latency returns to baseline.", x: 1140, y: 990, born: 19}
